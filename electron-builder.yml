appId: io.velt.client
productName: VELT Client
copyright: Copyright © 2026 VELT

directories:
  output: release
  buildResources: build

# В сборку попадает только dist/ и манифест.
# src/ и research/ остаются снаружи.
files:
  - dist/**/*
  - package.json
  - "!**/*.map"

asar: true

# compression: maximum не ставим — проверено, размер установщика
# не меняется вообще (92.3 МБ в обоих случаях), а сборка идёт дольше.
# Вес задаёт Chromium внутри Electron, сжимать там уже нечего.

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # Имя без пробелов — принципиально.
  #
  # GitHub при загрузке заменяет пробелы в имени файла на точки, а
  # electron-builder пишет в latest.yml имя с дефисами. Из-за этого
  # ссылка в фиде обновлений не совпадает с реальным именем ассета,
  # и автообновление молча перестаёт находить новую версию.
  artifactName: VELT-Client-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VELT Client
  deleteAppDataOnUninstall: false

portable:
  artifactName: VELT-Client-${version}-portable.${ext}

# Автообновление. Клиент проверяет релизы именно в этом репозитории,
# поэтому owner и repo должны совпадать с реальным адресом на GitHub.
# Если не совпадут, updater не найдёт фид и тихо выключится
# (см. src/main/services.js) — клиент при этом продолжит работать.
publish:
  provider: github
  owner: spelen1t1k-svg
  repo: velt-client
  releaseType: release
